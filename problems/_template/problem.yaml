# Problem manifest — consumed by the packager (problems/package.py) and the portal's
# problem index (registry.py). Only the fields below exist; anything else you add is
# ignored by everything (schema trimmed 2026-07-30 — put interviewer
# guidance in rubric.md, and declare Python dependencies in
# environments/requirements.workspace.txt + regenerate requirements.lock).
id: <track>-<slug>-<nnn>
title: Human-readable title

# Visibility baseline (the manifests ARE the registry): draft | hidden | active |
# retired. active/draft are selectable in the session form; admins can Show/Hide on
# top of this from the panel (problem_visibility.json overrides win).
status: draft

summary: >
  One-paragraph interviewer-facing summary of what this problem tests.

# Candidate-visible paths (everything else stays interviewer-only — the packager
# refuses solution/, rubric.md, data_raw/, answer keys, whatever the list says).
candidate_paths:
  - problem.md
  - starter/
  - data/README.md

# Omit `data:` entirely for problems with no dataset. The generator must be seeded
# and reproducible (the seed lives in the script); committed data/dist/ wins over
# regeneration when present.
data:
  generator: data/generate.py
