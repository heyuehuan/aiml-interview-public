# Interview workspace stack.
# The first cut delivered the proxy + workspace tools; the portal replaces the portal-stub with the real
# session service (portal :8000) + admin panel (:8001) and drives the non-root workspace.
# Only the proxy publishes a host port; every other service is internal-network only.
name: interview-workspace

services:
  # Single reverse proxy fronting everything.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Loopback-only plain HTTP. In production the host nginx terminates TLS for
      # interview.example.com (TLS cert) and reverse-proxies to this.
      - "127.0.0.1:${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      portal:
        condition: service_healthy
    # Fronts both sides: portal/admin on the interview net, code-server/Jupyter on the
    # candidate net. Because caddy is reachable FROM the candidate net, the Caddyfile
    # refuses /admin/* and /api/* for sources in the candidate container range —
    # a candidate shell may only use /ide, /jupyter and the session-home routes.
    networks: [interview, candidate]

  # the portal candidate portal: access code -> terms -> home, plus /api/authz.
  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    image: interview-platform/portal:dev
    restart: unless-stopped
    command: ["python", "/app/portal.py"]
    environment: &portal_env
      PORT: "8000"
      # dev|prod (default prod): outside dev the services refuse to boot on the public
      # dev secrets below.
      APP_ENV: ${APP_ENV:-prod}
      # Secure cookies on by default; dev over plain HTTP sets COOKIE_SECURE=0 in .env.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      PLATFORM_DB: /data/platform.db
      DATA_DIR: /data
      CONTROL_FILE: /control/active.json
      WORKSPACE_DIR: /workspace
      PROBLEMS_SEED_DIR: /problems_seed
      PROBLEMS_REGISTRY: /srv/problems/registry.yaml
      PACKAGER_CWD: /srv
      # unillm: one shared master key. LLM_BASE_URL is the *candidate-facing* URL
      # baked into the workspace env (loopback forwarder → unillm). UNILLM_INTERNAL_URL
      # is the compose-internal URL the admin's Test-Gemini button calls server-side.
      UNILLM_MASTER_KEY: ${UNILLM_MASTER_KEY:?UNILLM_MASTER_KEY must be set in .env — see .env.example}
      UNILLM_INTERNAL_URL: ${UNILLM_INTERNAL_URL:-http://unillm:8081/v1}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:8081/v1}
      # Candidate-facing URL printed on the admin's PDF handout. Display
      # only — nothing routes on it.
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-https://interview.example.com/}
      # export/reset scripts (mounted at /srv/scripts below).
      SCRIPTS_DIR: /srv/scripts
      # No insecure default: .env must set this (dev value lives in .env.example).
      PORTAL_SECRET: ${PORTAL_SECRET:?PORTAL_SECRET must be set in .env — see .env.example}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # No admin/admin default: the app refuses to boot outside APP_ENV=dev unless a
      # real credential is configured (ADMIN_PASSWORD_HASH preferred in prod).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      - ./portal:/app:ro
      - ../problems:/srv/problems:ro
      - ../scripts:/srv/scripts:ro   # export/reset scripts (integrations.py runs these)
      - platform_data:/data
      - control:/control
      - problems_seed:/problems_seed
      # RW so the candidate "copy to workspace" button can drop seeded problem files in.
      - workspace:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [interview]

  # the portal admin panel (/admin/* -> :8001). Same code + DB as the portal.
  admin:
    build:
      context: .
      dockerfile: Dockerfile.portal
    image: interview-platform/portal:dev
    restart: unless-stopped
    command: ["python", "/app/admin.py"]
    environment:
      <<: *portal_env
      PORT: "8001"
    volumes:
      - ./portal:/app:ro
      - ../problems:/srv/problems:ro
      - ../scripts:/srv/scripts:ro   # export/reset scripts (integrations.py runs these)
      - platform_data:/data
      - control:/control
      - problems_seed:/problems_seed
      - workspace:/workspace
    depends_on:
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;exit(0 if urllib.request.urlopen('http://localhost:8001/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [interview]

  # unillm: OpenAI-compatible Vertex AI Gemini proxy. Unlike the other services it
  # is published directly on host :8081 (candidates use localhost:8081, prod domain:8081)
  # rather than fronted by caddy. Auth: the server-side master key plus
  # the per-session candidate key read live from the control file — the
  # Vertex service-account credential is mounted read-only and never leaves this container.
  unillm:
    build:
      context: ../proxy
      dockerfile: Dockerfile
    image: interview-platform/unillm:dev
    restart: unless-stopped
    ports:
      # Loopback-only: candidates reach unillm in-container via the workspace loopback
      # forwarder (→ unillm:8081 on the candidate net), so 8081 need not be public.
      - "127.0.0.1:${UNILLM_HOST_PORT:-8081}:8081"
    environment:
      UNILLM_MASTER_KEY: ${UNILLM_MASTER_KEY:?UNILLM_MASTER_KEY must be set in .env — see .env.example}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      # Transcript audit stream: unillm appends every completion to the
      # active session's llm_transcript.jsonl, resolving the session from the control file.
      DATA_DIR: /data
      CONTROL_FILE: /control/active.json
      # Cost/DoS guards: output-token ceiling per call + per-key request budget.
      UNILLM_MAX_OUTPUT_TOKENS: ${UNILLM_MAX_OUTPUT_TOKENS:-8192}
      UNILLM_RATE_LIMIT_PER_MIN: ${UNILLM_RATE_LIMIT_PER_MIN:-60}
    volumes:
      - ${GCP_SA_KEY_FILE:-./secrets/gcp-sa.json}:/secrets/gcp-sa.json:ro
      - platform_data:/data          # writes only data/sessions/<id>/llm_transcript.jsonl
      - control:/control:ro          # reads the active session_id; never writes it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;exit(0 if urllib.request.urlopen('http://localhost:8081/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    # On both nets: candidate containers must reach it; the admin's Test-Gemini button
    # calls it server-side from the portal net.
    networks: [interview, candidate]

  # VS Code in the browser (/ide -> :8443). Launched as the non-root
  # candidate user by the the portal entrypoint once a session is active.
  code-server:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    image: interview-platform/workspace:dev
    restart: unless-stopped
    environment:
      WORKSPACE_TOOL: code-server
      CONTROL_FILE: /control/active.json
      WORKSPACE_DIR: /data/workspace
    # NO problems_seed mount: the candidate has a shell in here, so a mounted seed would
    # let them read every packaged problem (theirs unreleased, and other sessions') off
    # the filesystem and bypass the moderator's release gate. Only portal/admin mount it;
    # they copy the released problem into the workspace volume on the moderator's action.
    volumes:
      - workspace:/data/workspace
      - control:/control:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8443/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Candidate net only: a candidate has a shell in here, so they must NOT be able to
    # reach portal:8000 / admin:8001 / the snapshot agent directly. unillm and caddy sit
    # on this net because the candidate needs the former and the latter must proxy in.
    networks: [candidate]

  # JupyterLab (/jupyter -> :8888), same image + same workspace volume.
  jupyterlab:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    image: interview-platform/workspace:dev
    restart: unless-stopped
    environment:
      WORKSPACE_TOOL: jupyter
      CONTROL_FILE: /control/active.json
      WORKSPACE_DIR: /data/workspace
      # set to the interview origin in prod so an unrelated site can't drive the
      # candidate's notebook; '*' is the dev default (candidate reaches it same-origin).
      WORKSPACE_ALLOW_ORIGIN: ${WORKSPACE_ALLOW_ORIGIN:-*}
    # NO problems_seed mount — see code-server above (candidate-reachable container).
    volumes:
      - workspace:/data/workspace
      - control:/control:ro
    depends_on:
      code-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/jupyter/api/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [candidate]   # see code-server: candidate-reachable containers are isolated

  # snapshot agent: commit data/workspace -> shadow.git every 60s
  # while a session is active. The git dependency lives only here (portal image stays
  # lean). The candidate workspace is mounted READ-ONLY; the agent writes only into
  # data/sessions/<id>/shadow.git, which no candidate container can reach.
  snapshot:
    image: alpine/git:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/srv/scripts/snapshot_agent.sh"]
    environment:
      DATA_DIR: /data
      WORKSPACE_DIR: /workspace
      CONTROL_FILE: /control/active.json
      SNAPSHOT_INTERVAL: "60"
    volumes:
      - platform_data:/data
      - workspace:/workspace:ro
      - control:/control:ro
      - ../scripts:/srv/scripts:ro
    networks: [interview]

volumes:
  workspace:
  platform_data:
  control:
  problems_seed:
  caddy_data:
  caddy_config:

networks:
  # Platform services (portal, admin, snapshot agent) — no candidate container attaches.
  # Subnets are pinned so the Caddyfile can tell candidate
  # containers apart from everything else by source IP.
  interview:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Candidate-reachable containers (code-server, JupyterLab) + what they legitimately
  # need (unillm, and caddy to proxy them in). A candidate has a terminal in here, so
  # anything on this net must be assumed reachable by them. Containers draw IPs from
  # ip_range 172.29.0.128/25 — the gateway/NAT source (172.29.0.1) stays outside it,
  # which is what lets caddy 403 the candidate range without breaking host-published
  # browser traffic.
  candidate:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          ip_range: 172.29.0.128/25
          gateway: 172.29.0.1
