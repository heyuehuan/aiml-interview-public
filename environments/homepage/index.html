<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1115; color: #e7e9ee;
      display: flex; flex-direction: column; align-items: center;
    }
    header { text-align: center; padding: 3rem 1rem 1rem; }
    header h1 { margin: 0; font-size: 1.6rem; letter-spacing: .01em; }
    main {
      width: 100%; max-width: 880px; padding: 1.5rem 1rem 3rem;
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    a.tile {
      display: block; text-decoration: none; color: inherit;
      background: #1a1d24; border: 1px solid #262a33; border-radius: 12px;
      padding: 1.25rem; transition: border-color .12s, transform .12s;
    }
    a.tile:hover { border-color: #3d7dff; transform: translateY(-2px); }
    a.tile .ico { height: 40px; display: flex; align-items: center; }
    a.tile .ico svg { width: 38px; height: 38px; display: block; }
    a.tile h2 { margin: .75rem 0 .25rem; font-size: 1.1rem; }
    a.tile p { margin: 0; color: #9aa0ab; font-size: .9rem; }
    footer { color: #6b717c; font-size: .8rem; padding-bottom: 2rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Workspace</h1>
  </header>
  <main>
    <a class="tile" href="/ide/" target="_blank" rel="noopener">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5b8def" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
          <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
          <path d="M9 13h6M9 17h6"/>
        </svg>
      </div>
      <h2>Problems</h2>
      <p>Click to view assigned problems.</p>
    </a>
    <a class="tile" href="/ide/" target="_blank" rel="noopener">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="#0e9dd8" aria-hidden="true">
          <path d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z"/>
        </svg>
      </div>
      <h2>Integrated Development Environment</h2>
      <p>code-server — VS Code in the cloud.</p>
    </a>
    <a class="tile" href="/jupyter/" target="_blank" rel="noopener">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="#f37726" aria-hidden="true">
          <path d="M7.157 22.201A1.784 1.799 0 0 1 5.374 24a1.784 1.799 0 0 1-1.784-1.799 1.784 1.799 0 0 1 1.784-1.799 1.784 1.799 0 0 1 1.783 1.799zM20.582 1.427a1.415 1.427 0 0 1-1.415 1.428 1.415 1.427 0 0 1-1.416-1.428A1.415 1.427 0 0 1 19.167 0a1.415 1.427 0 0 1 1.415 1.427zM4.992 3.336A1.047 1.056 0 0 1 3.946 4.39a1.047 1.056 0 0 1-1.047-1.055A1.047 1.056 0 0 1 3.946 2.28a1.047 1.056 0 0 1 1.046 1.056zm7.336 1.517c3.769 0 7.06 1.38 8.768 3.424a9.363 9.363 0 0 0-3.393-4.547 9.238 9.238 0 0 0-5.377-1.728A9.238 9.238 0 0 0 6.95 3.73a9.363 9.363 0 0 0-3.394 4.547c1.713-2.04 5.004-3.424 8.772-3.424zm.001 13.295c-3.768 0-7.06-1.381-8.768-3.425a9.363 9.363 0 0 0 3.394 4.547A9.238 9.238 0 0 0 12.33 21a9.238 9.238 0 0 0 5.377-1.729 9.363 9.363 0 0 0 3.393-4.547c-1.712 2.044-5.003 3.425-8.772 3.425Z"/>
        </svg>
      </div>
      <h2>JupyterLab</h2>
      <p>Notebooks in your workspace.</p>
    </a>
  </main>
  <footer>
    &copy; 2026 Technical Interview Platform
  </footer>
</body>
</html>
