# unillm proxy config. Gemini-only allowlist — unillm serves *only* the models
# listed here, so this file is the model gate.
# Vertex project comes from the mounted service-account credential
# (GOOGLE_APPLICATION_CREDENTIALS).
#
# location: global — Gemini 3.x models are served ONLY from the global endpoint
# (aiplatform.googleapis.com), not regional hosts. unillm's vertex handler maps
# location: global to the un-prefixed host.
#
# gemini-3.1-pro is the opt-in tier. Enable it only once the
# project can reach it; the two flash models below are the working defaults.
# pricing: USD per 1M tokens, used for the per-session dollar budget —
# every completion is priced into llm_transcript.jsonl (cost_usd) and counted against
# the session's llm_budget_usd (warn 100%, hard cutoff 120%). Operator-maintained:
# VERIFY against Google's current Vertex AI price sheet when models change. A model
# with no pricing block is costed at a conservative built-in default (budget.py),
# never at zero.
model_list:
  - model_name: gemini-3.5-flash
    unillm_params:
      model: gemini-3.5-flash
      project: your-gcp-project
      location: global
    pricing:
      input_per_1m: 0.30
      output_per_1m: 2.50
  - model_name: gemini-3.1-flash-lite
    unillm_params:
      model: gemini-3.1-flash-lite
      project: your-gcp-project
      location: global
    pricing:
      input_per_1m: 0.10
      output_per_1m: 0.40
  - model_name: gemini-3.1-pro
    unillm_params:
      model: gemini-3.1-pro
      project: your-gcp-project
      location: global
    pricing:
      input_per_1m: 2.50
      output_per_1m: 15.00

# NOTE: the proxy binds the port from the CLI/compose (`--port`, default 4000; compose
# publishes 8081), NOT from this file — a `general_settings.port` here is never read
#, so it was removed to avoid implying otherwise.
